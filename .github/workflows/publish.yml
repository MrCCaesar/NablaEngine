# Builds the sdist and the wheel and publishes them to PyPI with Trusted Publishing (OIDC, no token).
# Run by hand from a release tag: Actions > Publish > Run workflow, "Use workflow from" the tag v<version>.
# The environment pypi (required reviewer, tags v* only) must approve the publish job.
name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Check
        run: python -m twine check --strict dist/*
      - name: Run from the tag of the package version
        env:
          REF: ${{ github.ref }}
        run: |
          version=$(ls dist/*.whl | sed -E 's#^dist/nablaengine-([^-]+)-.*#\1#')
          echo "built $version from $REF"
          if [ "$REF" != "refs/tags/v$version" ]; then
            echo "::error::run this workflow from the tag v$version (ref is $REF)"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nablaengine/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
